services:
  mongodb:
    image: 'mongo:latest'
    env_file:
      - .env
    ports:
      - '27017'
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    env_file:
      - .env
    ports:
      - '8080:8080'
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  parser:
    build:
      context: ./parser
    env_file:
      - .env
    ports:
      - '8000:8000'
    depends_on:
      core:
        condition: service_healthy
